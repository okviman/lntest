name: release

# Publishes to PyPI when a version tag is pushed.
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Uses PyPI Trusted Publishing (OIDC), so the repository holds no API token.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # lets you rehearse build+check without tagging

permissions:
  contents: read

jobs:
  build:
    name: build and check the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      # setuptools reuses build/lib if present, which can ship modules no longer in src/.
      - name: Remove stale build artifacts
        run: rm -rf build dist src/*.egg-info

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distribution metadata
        run: twine check --strict dist/*

      # A PyPI version is permanent, so the tag and pyproject's version must agree.
      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag=$tag  pyproject=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag v$tag does not match pyproject version $pkg"; exit 1; }

      # The wheel holds the package modules and nothing else.
      - name: Wheel contains exactly the package modules
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          whl = glob.glob("dist/*.whl")[0]
          got = sorted(n for n in zipfile.ZipFile(whl).namelist() if n.endswith(".py"))
          want = ["lntest/__init__.py", "lntest/_ln_test.py", "lntest/_rank_genes_groups.py"]
          print("wheel:", whl)
          for n in got: print("  ", n)
          if got != want:
              print("::error::unexpected wheel contents", file=sys.stderr)
              print("expected:", want, file=sys.stderr)
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  ci:
    name: tests and floor check
    uses: ./.github/workflows/ci.yml

  publish:
    name: publish to PyPI
    needs: [build, ci]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ln-ttest
    permissions:
      id-token: write        # the OIDC token trusted publishing exchanges
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
