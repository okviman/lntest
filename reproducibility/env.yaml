name: de-ziln-reproducibility
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.11
  - numpy
  - scipy<1.16
  - statsmodels
  # pandas 3 makes arrow-backed strings the default, which anndata 0.12 cannot write to .h5ad.
  - pandas<3
  - scanpy
  - scikit-learn
  - matplotlib
  - jupyter
  - ipykernel
  - r-base>=4.3
  - rpy2>=3.5
  - anndata2ri>=1.3
  - bioconductor-mast
  - bioconductor-edger
  # The CITE-seq chain in citeseq/R/ (Seurat, mclust, tidyverse, zellkonverter).
  - r-seurat
  # Harmony over patient and sex for the Abdelfattah et al. 2022 myeloid UMAP (published/R/abdelfattah2022_umap.R).
  - r-harmony
  # The authors' GSEA for Abdelfattah et al. 2022 (published/R/abdelfattah2022_fgsea.R): fgsea on msigdbr's Hallmark
  # sets, msigdbr pinned at the release nearest their code (newer releases renamed genes and moved the data out).
  - bioconductor-fgsea
  - r-msigdbr=7.5.1
  # Read10X_h5 needs hdf5r, which Seurat does not install.
  - r-hdf5r
  - r-mclust
  - r-tidyverse
  - bioconductor-zellkonverter
  - filelock
  # Visium HD spot-to-cell assignment (kidney/preprocess.py, lymphnode/).
  - geopandas
  - shapely
  - pyarrow
  # Reads a crop of the full-resolution kidney H&E for kidney/capsule_figure.py.
  - tifffile
  # Reads the same way from the lymph node's H&E (figures/diagrams/fig2_lymphnode.py).
  - zarr
  # Places the Fig 1 panels, as vector PDF pages, on one page (figures/fig1.py).
  - pypdf
  - pip
  - pip:
      - leidenalg
      - gseapy
      # The lymph node's pseudo-bulk reference (lymphnode/pseudobulk_reference.py).
      - pydeseq2
      # Cell-type labels for the PBMC datasets (clustering/celltype_labels.py).
      - celltypist
      # Scrublet's automatic doublet threshold in scanpy (clustering/pbmc10k_prep.py).
      - scikit-image
