name: de-ziln-reproducibility
channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - python=3.11
  - numpy
  - scipy<1.16
  - statsmodels
  # pandas<3 is load-bearing, not caution. pandas 3.0 makes the arrow-backed
  # `str` dtype the default for string columns and indices, and anndata 0.12.6
  # has no writer registered for it, so `adata.write()` raises IORegistryError
  # on *any* AnnData -- `ad.AnnData(np.ones((3, 2))).write(...)` is enough to
  # reproduce it. Unpinned, this file resolved to pandas 3.0.0 on 2026-09-10
  # and the environment it built could not write an h5ad at all.
  #
  # clustering/de.py already works around this in one place, with its own
  # coerce_arrow_strings() helper. celltype/de.py does not, and dies on its
  # save after completing every DE test. The pin is here so the next arm that
  # writes an .h5ad does not have to rediscover the workaround.
  - pandas<3
  - scanpy
  - scikit-learn
  - matplotlib
  - jupyter
  - ipykernel
  - r-base>=4.3
  - rpy2>=3.5
  - anndata2ri>=1.3
  - bioconductor-mast
  - bioconductor-edger
  # The CITE-seq chain: citeseq/R/pbmc10k_process.R (Seurat, mclust, tidyverse)
  # and pbmc10k_to_h5ad.R (Seurat, zellkonverter::writeH5AD). Without these the
  # arm can only run from the committed memory_CD4.h5ad, never from a download.
  #
  # pbmc10k_to_h5ad.R also `library()`s anndata, basilisk, reticulate, splatter,
  # ggplot2 and data.table and uses none of them; those imports were removed
  # rather than adding the packages, splatter especially.
  - r-seurat
  # Read10X_h5 needs hdf5r and Seurat does not pull it in: without it the
  # chain fails at its first line with "Please install hdf5r to read HDF5 files".
  - r-hdf5r
  - r-mclust
  - r-tidyverse
  - bioconductor-zellkonverter
  - filelock
  # Visium HD spot-to-cell assignment: lymphnode/reproduce_vishd_cluster1_cluster3.sh
  # and kidney/preprocess.ipynb both need these. They were missing until the
  # lymph node preprocessing scripts arrived, so neither spatial arm's
  # preprocessing could ever have run in this environment.
  - geopandas
  - shapely
  - pyarrow
  # Reads a crop of the full-resolution kidney H&E for kidney/capsule_figure.py.
  - tifffile
  # Places the Fig 1 panels, as vector PDF pages, on one page (figures/fig1.py).
  - pypdf
  - pip
  - pip:
      - decoupler
      - leidenalg
      - pertpy
      - gseapy
      # The lymph node's pseudo-bulk reference (lymphnode/pseudobulk_reference.py).
      - pydeseq2