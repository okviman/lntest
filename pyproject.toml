[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
# The distribution name. The import name is `lntest` (PyPI refuses `lntest` as
# too close to the existing `intest`).
name = "ln-ttest"
version = "0.3.0"
description = "LN's t-test: differential expression testing on an asymptotically unbiased log-fold-change estimator"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Oskar Kviman" },
    { name = "Pedro F. Ferreira" },
]
maintainers = [
    { name = "Pedro F. Ferreira", email = "pedro.miguel.ferreira.pf@gmail.com" },
]
license = { file = "LICENSE" }
keywords = ["single-cell", "differential-expression", "transcriptomics", "scanpy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    # Benjamini-Hochberg, as scanpy computes it.
    "statsmodels>=0.13",
]

[project.urls]
Homepage = "https://github.com/okviman/lntest"
Source = "https://github.com/okviman/lntest"

[project.optional-dependencies]
# The package never imports anndata or pandas. The tests build AnnData objects
# and compare the correction with scanpy's.
test = ["anndata>=0.9", "pandas>=1.5", "scanpy>=1.10", "pytest>=7"]
anndata = []  # empty, so that `pip install ln-ttest[anndata]` still works

[tool.setuptools]
packages = ["lntest"]
package-dir = { "" = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]
